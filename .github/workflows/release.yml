name: Release

# Push a tag like v0.2.0 to build and publish a release. The notes come from the section
# "## v0.2.0 ..." of CHANGELOG.md. Run it by hand (workflow_dispatch) to get the files as a
# build artifact without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Version from the tag
        id: v
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith("v")) { $tag = "v0.0.0-dev" }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$($tag.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Build and package
        shell: pwsh
        run: ./scripts/package.ps1 -Version ${{ steps.v.outputs.version }}

      - name: Release notes
        shell: pwsh
        run: ./scripts/release-notes.ps1 -Tag ${{ steps.v.outputs.tag }} -Output notes.md

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem dist -File | ForEach-Object { $_.FullName }
          gh release create "${{ steps.v.outputs.tag }}" @files --title "BetterConsole ${{ steps.v.outputs.tag }}" --notes-file notes.md

      - name: Keep the files (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: betterconsole-${{ steps.v.outputs.version }}
          path: |
            dist/
            notes.md
